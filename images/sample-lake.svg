<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0eafc"/>
      <stop offset="100%" stop-color="#cfdef3"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4b6cb7"/>
      <stop offset="100%" stop-color="#182848"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b4db"/>
      <stop offset="100%" stop-color="#0083b0"/>
    </linearGradient>
  </defs>
  <!-- 하늘 -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <!-- 별빛/햇살 -->
  <circle cx="650" cy="120" r="40" fill="#fff" opacity="0.85"/>
  <circle cx="650" cy="120" r="70" fill="#fff" opacity="0.2"/>
  <!-- 먼 설산 -->
  <polygon points="120,320 280,140 440,320" fill="url(#mountain1)" opacity="0.9"/>
  <polygon points="280,140 330,210 240,230" fill="#ffffff"/>
  <polygon points="340,320 520,110 700,320" fill="url(#mountain1)" opacity="0.95"/>
  <polygon points="520,110 580,190 470,210" fill="#ffffff"/>
  <!-- 앞쪽 산맥 -->
  <polygon points="-40,340 180,190 380,340" fill="url(#mountain2)" opacity="0.95"/>
  <polygon points="460,340 680,180 880,340" fill="url(#mountain2)" opacity="0.95"/>
  <!-- 호수 -->
  <rect y="310" width="800" height="190" fill="url(#lakeGrad)"/>
  <!-- 호수 반사광 효과 -->
  <ellipse cx="400" cy="360" rx="350" ry="15" fill="#ffffff" opacity="0.2"/>
  <ellipse cx="400" cy="400" rx="280" ry="10" fill="#ffffff" opacity="0.15"/>
  <ellipse cx="400" cy="440" rx="200" ry="8" fill="#ffffff" opacity="0.1"/>
  <!-- 텍스트 배지 -->
  <rect x="25" y="25" rx="6" ry="6" width="160" height="34" fill="#000000" opacity="0.5"/>
  <text x="105" y="47" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🏔️ 에메랄드 호수</text>
</svg>
